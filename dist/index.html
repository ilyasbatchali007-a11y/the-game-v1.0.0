<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECS Engine</title>
    <style>
      /* Reset defaults to prevent awkward offsets */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: #1a1a1e;
      }

      /* Start Menu Styles */
      #start-menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      #start-menu.hidden {
        display: none;
      }

      .menu-title {
        font-size: 4rem;
        color: #e94560;
        text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        margin-bottom: 3rem;
        letter-spacing: 4px;
      }

      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .menu-btn {
        padding: 1rem 3rem;
        font-size: 1.5rem;
        background: transparent;
        border: 2px solid #e94560;
        color: #e94560;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 8px;
        min-width: 250px;
      }

      .menu-btn:hover {
        background: #e94560;
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
      }

      /* Save List Modal */
      #save-modal {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 200;
      }

      #save-modal.active {
        display: flex;
      }

      .modal-content {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border: 2px solid #e94560;
        border-radius: 12px;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .modal-title {
        font-size: 2rem;
        color: #e94560;
      }

      .close-btn {
        background: transparent;
        border: none;
        color: #e94560;
        font-size: 2rem;
        cursor: pointer;
        transition: transform 0.3s;
      }

      .close-btn:hover {
        transform: scale(1.2);
      }

      .save-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .save-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: rgba(233, 69, 96, 0.1);
        border: 1px solid rgba(233, 69, 96, 0.3);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .save-item:hover {
        background: rgba(233, 69, 96, 0.2);
        border-color: #e94560;
        transform: translateX(10px);
      }

      .save-item-info {
        flex: 1;
      }

      .save-item-name {
        color: #fff;
        font-size: 1.2rem;
        margin-bottom: 0.25rem;
      }

      .save-item-date {
        color: #aaa;
        font-size: 0.9rem;
      }

      .save-item-actions {
        display: flex;
        gap: 0.5rem;
      }

      .action-btn {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border: 1px solid #e94560;
        background: transparent;
        color: #e94560;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
      }

      .action-btn:hover {
        background: #e94560;
        color: #fff;
      }

      .action-btn.delete:hover {
        background: #ff6b6b;
        border-color: #ff6b6b;
      }

      .empty-message {
        color: #aaa;
        text-align: center;
        padding: 2rem;
        font-style: italic;
      }

      .modal-mode {
        display: none;
      }

      #save-modal.mode-load .load-controls,
      #save-modal.mode-save .save-controls {
        display: block;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DtHoXz7I.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="canvas"></canvas>
      
      <!-- Start Menu -->
      <div id="start-menu">
        <h1 class="menu-title">ECS ENGINE</h1>
        <div class="menu-buttons">
          <button class="menu-btn" id="btn-new-game">New Game</button>
          <button class="menu-btn" id="btn-load-game">Load Game</button>
          <button class="menu-btn" id="btn-save-game">Save Game</button>
        </div>
      </div>

      <!-- Save/Load Modal -->
      <div id="save-modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="modal-title">Load Game</h2>
            <button class="close-btn" id="btn-close-modal">&times;</button>
          </div>
          
          <div class="modal-mode load-controls" id="load-controls">
            <div class="save-list" id="load-save-list"></div>
          </div>
          
          <div class="modal-mode save-controls" id="save-controls" style="display: none;">
            <div class="save-list" id="save-save-list"></div>
          </div>
          
          <div id="empty-message" class="empty-message">No saves found</div>
        </div>
      </div>
    </div>
    
  </body>
</html>
