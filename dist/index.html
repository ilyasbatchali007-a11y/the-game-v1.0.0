<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECS Engine</title>
    <style>
      /* Reset defaults to prevent awkward offsets */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: #1a1a1e;
      }

      /* Start Menu Styles */
      #start-menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      #start-menu.hidden {
        display: none;
      }

      .menu-title {
        font-size: 4rem;
        color: #e94560;
        text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        margin-bottom: 3rem;
        letter-spacing: 4px;
      }

      .menu-subtitle {
        font-size: 1.5rem;
        color: #aaa;
        margin-bottom: 2rem;
      }

      .start-button {
        padding: 1rem 3rem;
        font-size: 1.5rem;
        background: rgba(233, 69, 96, 0.2);
        border: 2px solid #e94560;
        color: #fff;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 2rem;
      }

      .start-button:hover {
        background: rgba(233, 69, 96, 0.4);
        border-color: #e94560;
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
      }

      /* Save Slots Container */
      .save-slots-container {
        display: none;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 500px;
        padding: 0 2rem;
      }

      .save-slots-container.visible {
        display: flex;
      }

      .save-slot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 2rem;
        background: rgba(233, 69, 96, 0.1);
        border: 2px solid rgba(233, 69, 96, 0.3);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        min-height: 80px;
      }

      .save-slot:hover {
        background: rgba(233, 69, 96, 0.2);
        border-color: #e94560;
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
      }

      .save-slot-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .save-slot-name {
        color: #fff;
        font-size: 1.3rem;
        font-weight: bold;
      }

      .save-slot-date {
        color: #aaa;
        font-size: 0.9rem;
      }

      .save-slot-empty {
        color: #666;
        font-size: 1.1rem;
        font-style: italic;
      }

      .save-slot-mark {
        display: none;
        width: 20px;
        height: 20px;
        background: #e94560;
        border-radius: 50%;
        margin-right: 1rem;
      }

      .save-slot.occupied .save-slot-mark {
        display: block;
      }

      .save-slot-delete {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        border: 1px solid #e94560;
        background: transparent;
        color: #e94560;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
        opacity: 0;
        pointer-events: none;
      }

      .save-slot:hover .save-slot-delete {
        opacity: 1;
        pointer-events: auto;
      }

      .save-slot-delete:hover {
        background: #ff6b6b;
        border-color: #ff6b6b;
        color: #fff;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DMmO1lXq.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="canvas"></canvas>
      
      <!-- Start Menu with Save Slots -->
      <div id="start-menu">
        <h1 class="menu-title">ECS ENGINE</h1>
        <button id="start-button" class="start-button">Start Game</button>
        <p class="menu-subtitle" id="slot-subtitle" style="display: none;">Select a slot to start or continue</p>
        <div class="save-slots-container" id="save-slots-container">
          <!-- Save slots will be rendered here -->
        </div>
      </div>
    </div>
    
  </body>
</html>
