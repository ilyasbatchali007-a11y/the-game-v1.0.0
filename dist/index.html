<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECS Engine</title>
    <style>
      /* Reset defaults to prevent awkward offsets */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: #1a1a1e;
      }

      /* Start Menu Styles */
      #start-menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      #start-menu.hidden {
        display: none;
      }

      .menu-title {
        font-size: 4rem;
        color: #e94560;
        text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        margin-bottom: 2rem;
        letter-spacing: 4px;
      }

      .start-btn {
        padding: 1rem 3rem;
        font-size: 1.5rem;
        background: transparent;
        border: 2px solid #e94560;
        color: #e94560;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 8px;
        min-width: 250px;
        margin-bottom: 2rem;
      }

      .start-btn:hover {
        background: #e94560;
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
      }

      .slots-container {
        display: none;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 500px;
      }

      .slots-container.visible {
        display: flex;
      }

      .save-slot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem;
        background: rgba(233, 69, 96, 0.1);
        border: 2px solid rgba(233, 69, 96, 0.3);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        min-height: 80px;
      }

      .save-slot:hover {
        background: rgba(233, 69, 96, 0.2);
        border-color: #e94560;
        transform: scale(1.02);
      }

      .save-slot.empty {
        opacity: 0.7;
        font-style: italic;
        color: #aaa;
      }

      .slot-info {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .slot-name {
        color: #fff;
        font-size: 1.2rem;
        font-weight: bold;
      }

      .slot-date {
        color: #aaa;
        font-size: 0.9rem;
        margin-top: 0.25rem;
      }

      .delete-btn {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        border: 1px solid #ff6b6b;
        background: transparent;
        color: #ff6b6b;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
        margin-left: 1rem;
      }

      .delete-btn:hover {
        background: #ff6b6b;
        color: #fff;
      }

      .hidden {
        display: none !important;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CvDlCrny.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="canvas"></canvas>
      
      <!-- Start Menu -->
      <div id="start-menu">
        <h1 class="menu-title">ECS ENGINE</h1>
        <button class="start-btn" id="btn-start">START</button>
        <div class="slots-container" id="slots-container">
          <!-- Slots will be rendered here by JS -->
        </div>
      </div>
    </div>
    
  </body>
</html>
